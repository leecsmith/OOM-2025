<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Overall Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    h1 { margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; }
    th { text-align: left; background: #f5f5f5; }
    tr:hover { background: #f9f9f9; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Overall Leaderboard</h1>
  <table id="leaderboard">
    <thead>
      <tr>
        <th>Pos</th>
        <th>Player</th>
        <th>Points</th>
        <th>Stableford</th>
        <th>Rounds</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector('#leaderboard tbody');

        data.overallLeaderboard
          .sort((a, b) => a.position - b.position)
          .forEach(player => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${player.position}</td>
              <td>${player.playerName}</td>
              <td>${player.totalPoints}</td>
              <td>${player.totalStableford}</td>
              <td>${player.totalRounds}</td>
            `;
            tr.onclick = () => {
              window.location.href = `player.html?id=${player.playerId}`;
            };
            tbody.appendChild(tr);
          });
      });
  </script>
</body>
</html>
